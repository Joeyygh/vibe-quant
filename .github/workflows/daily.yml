name: Daily Data Update

# v4: 简化 - 17:00 主 + 20:00 二次
# 两次都失败 = 软件 bug, 不再叠 cron 浪费时间
on:
  schedule:
    - cron: '0 9 * * 1-5'    # 北京 17:00 主
    - cron: '0 12 * * 1-5'   # 北京 20:00 二次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare pandas pyarrow

      - name: Update data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p data
          python scripts/update_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: daily data update $(date +%Y-%m-%d)"
          git push
        continue-on-error: true

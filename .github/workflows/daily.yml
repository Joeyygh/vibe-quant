name: Daily Data Update

# v3: 多 cron 兜底 (17:00/17:30/18:00 北京), 任何一次成功就够
on:
  schedule:
    - cron: '0 9 * * 1-5'    # 北京 17:00
    - cron: '0 9,10 * * 1-5' # 北京 17:00 + 18:00 (重置)
    - cron: '30 9 * * 1-5'   # 北京 17:30 二次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare pandas pyarrow

      - name: Update data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p data
          python scripts/update_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: daily data update $(date +%Y-%m-%d)"
          git push
        continue-on-error: true

name: Daily Data Update

# v5: 数据拉取 18:00 + 19:30 北京 (UTC 10 + 11:30)
# 19:30 完成 → 21:00 报告使用当天数据
on:
  schedule:
    - cron: '0 10 * * 1-5'    # 北京 18:00 首次拉取 (收盘后数据稳定)
    - cron: '30 11 * * 1-5'   # 北京 19:30 二次拉取 (Tushare 最终数据)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare pandas pyarrow

      - name: Update data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p data
          python scripts/update_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: daily data update $(date +%Y-%m-%d)"
          git push
        continue-on-error: true

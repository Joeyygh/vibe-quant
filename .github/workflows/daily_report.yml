name: Daily Report

# v2: 报告改为北京 21:00 出 (UTC 13) - 当天收盘复盘
# 数据由 daily.yml 19:30 北京 (UTC 11:30) 提前拉好
# v3 (2026-09-18): 增加 my_holdings.json 健康检查
# v5 (2026-09-27): 修真正的 P0 —— 本文件从 9/18 起就是"解析失败"状态
#   起因: v3 加的那行 step 名是
#       - name: Health check: my_holdings.json
#   step 名里未加引号的 ": " 是 YAML 的键值分隔符 → 整个文件解析失败。
#   症状: actions 注册表里本文件 name 显示成文件路径而不是 "Daily Report";
#         每次 push 产生一条 event=push、0 job、秒挂的失败运行;
#         workflow_dispatch 返回 422 "does not have workflow_dispatch";
#         定时任务被 GitHub 静默跳过 —— 所以 9/18 之后日报一次都没出。
#   修复: step 名加引号去掉冒号。已用探针 workflow 实证:
#         裸 ": " 构造 → 解析失败;去掉冒号 → 正常。
#   ⚠️ 同类隐患已用 scripts/lint_workflows.py 加了扫描,见 safety_net.yml 的 v5。
# v4 (2026-09-27): 修 P0 —— 健康检查从"门禁"降级为"体检"
#   起因: v3 用 STALE_DAYS=3 + continue-on-error=false,持仓超过 3 天没更新
#   就把整个流水线(fetch_news + 选股 + 复盘)全部 fail 掉,
#   9/18~9/27 连续 9 天日报停摆。
#   根因: 持仓是"用户调仓才更新"的数据,不是每天刷新的数据。
#   修复: check_holdings.py 内部改为只对文件级损坏 fail(见该文件 v2 说明),
#         本步骤再兜一层 continue-on-error,保证体检永远不会阻断出报告。
on:
  schedule:
    - cron: '0 13 * * 1-5'    # 北京 21:00 当日报告
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tushare pandas pyarrow yfinance numpy

      - name: 'Health check - my_holdings.json (advisory)'
        id: holdings
        run: |
          python scripts/check_holdings.py
        # 只体检,绝不阻断。持仓坏了 daily_report.py 内部会降级跳过持仓章节,
        # 日资金流/选股/指数该出还是出。
        continue-on-error: true

      - name: Fetch news & announcements
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/fetch_news.py

      - name: Generate daily report
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/daily_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "daily report: $(date +%Y-%m-%d)"
          git push
        continue-on-error: true

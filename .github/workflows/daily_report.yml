name: Daily Report

# v2: 报告改为北京 21:00 出 (UTC 13) - 当天收盘复盘
# 数据由 daily.yml 19:30 北京 (UTC 11:30) 提前拉好
on:
  schedule:
    - cron: '0 13 * * 1-5'    # 北京 21:00 当日报告
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tushare pandas pyarrow yfinance numpy

      - name: Fetch news & announcements
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/fetch_news.py

      - name: Generate daily report
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/daily_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "daily report: $(date +%Y-%m-%d)"
          git push
        continue-on-error: true

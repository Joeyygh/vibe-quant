name: Safety Net - Auto Heal Data

# v4: 扩大兜底, 周末也跑 (原来 1-5 太严, 9/5-9/7 整个周末 + 周一全漏)
# 平时每 2 小时检查一次, 发现数据陈旧就自动拉
on:
  schedule:
    # 工作日 (北京 17-23 点, 跟 daily/report 错开)
    - cron: '0 9 * * 1-5'    # 北京 17:00
    - cron: '0 11 * * 1-5'   # 北京 19:00 (daily 19:30 跑前, 提前补)
    - cron: '0 13 * * 1-5'   # 北京 21:00 (跟 daily_report 同时, 报告后 1 小时)
    # 周末/节假日 (8-23 点每小时, 兜底)
    - cron: '0 0-15 * * 0,6' # 北京 8-23 点每小时 (周末 16 次/天, 必中)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare pandas pyarrow

      - name: Check data freshness
        id: check
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          TODAY=$(date -d 'today' +%Y%m%d)
          python -c "
          import tushare as ts
          import os
          ts.set_token(os.environ['TUSHARE_TOKEN'])
          pro = ts.pro_api()
          today = '$TODAY'
          try:
              df = pro.daily(trade_date=today, fields='ts_code,trade_date')
              if len(df) > 100:
                  print('FRESH')
              else:
                  print('STALE')
          except Exception as e:
              print('STALE')
              print(f'err: {e}', file=__import__('sys').stderr)
          " > /tmp/freshness.txt 2>&1
          STATE=$(tail -1 /tmp/freshness.txt | tr -d '
')
          echo "freshness=$STATE"
          echo "freshness=$STATE" >> $GITHUB_OUTPUT

      - name: Update data if stale
        if: steps.check.outputs.freshness != 'FRESH'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p data
          python scripts/update_data.py

      - name: Commit and push
        if: steps.check.outputs.freshness != 'FRESH'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: safety-net auto-heal $(date +%Y-%m-%d)"
          git push
        continue-on-error: true

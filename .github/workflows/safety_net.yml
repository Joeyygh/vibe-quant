name: Safety Net - Auto Heal Data

# v2: 保险丝
# 17:00 / 18:30 / 20:00 北京 (UTC 9/10:30/12) 各查一次
# 数据陈旧就自动跑, 保证 19:30 前数据到位, 21:00 报告能用
on:
  schedule:
    - cron: '0 9 * * 1-5'    # 北京 17:00 (主拉前,保险)
    - cron: '30 10 * * 1-5'  # 北京 18:30 (首次拉后,补)
    - cron: '0 12 * * 1-5'   # 北京 20:00 (二次拉后,最终)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare pandas pyarrow

      - name: Check data freshness
        id: check
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          TODAY=$(date -d 'today' +%Y%m%d)
          python -c "
          import tushare as ts
          import os
          ts.set_token(os.environ['TUSHARE_TOKEN'])
          pro = ts.pro_api()
          today = '$TODAY'
          try:
              df = pro.daily(trade_date=today, fields='ts_code,trade_date')
              if len(df) > 100:
                  print('FRESH')
              else:
                  print('STALE')
          except Exception as e:
              print('STALE')
              print(f'err: {e}', file=__import__('sys').stderr)
          " > /tmp/freshness.txt 2>&1
          STATE=$(tail -1 /tmp/freshness.txt | tr -d '
')
          echo "freshness=$STATE"
          echo "freshness=$STATE" >> $GITHUB_OUTPUT

      - name: Update data if stale
        if: steps.check.outputs.freshness != 'FRESH'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p data
          python scripts/update_data.py

      - name: Commit and push
        if: steps.check.outputs.freshness != 'FRESH'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: safety-net auto-heal $(date +%Y-%m-%d)"
          git push
        continue-on-error: true

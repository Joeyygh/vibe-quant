name: Safety Net - Auto Heal Data

# v4: 扩大兜底, 周末也跑 (原来 1-5 太严, 9/5-9/7 整个周末 + 周一全漏)
# 平时每 2 小时检查一次, 发现数据陈旧就自动拉
on:
  schedule:
    # 工作日 (北京 17-23 点, 跟 daily/report 错开)
    - cron: '0 9 * * 1-5'    # 北京 17:00
    - cron: '0 11 * * 1-5'   # 北京 19:00 (daily 19:30 跑前, 提前补)
    - cron: '0 13 * * 1-5'   # 北京 21:00 (跟 daily_report 同时, 报告后 1 小时)
    # 周末/节假日 (8-23 点每小时, 兜底)
    - cron: '0 0-15 * * 0,6' # 北京 8-23 点每小时 (周末 16 次/天, 必中)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare pandas pyarrow

      - name: Check data freshness
        id: check
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        # v5 (2026-09-27): 原先这段是在 run: | 块标量里内嵌 python -c 和
        # `tr -d '` + 真实换行 + `')`,而续行落在第 0 列 → 提前结束了块标量,
        # YAML 直接解析失败 → GitHub 把本文件标记为无效 → 整个兜底机制
        # 从来没跑过(actions 列表里 name 显示成文件路径就是症状)。
        # 现在抽成 scripts/check_freshness.py,YAML 里只留一行干净调用。
        run: python scripts/check_freshness.py

      - name: Update data if stale
        if: steps.check.outputs.freshness != 'FRESH'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p data
          python scripts/update_data.py

      - name: Commit and push
        if: steps.check.outputs.freshness != 'FRESH'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: safety-net auto-heal $(date +%Y-%m-%d)"
          git push
        continue-on-error: true
